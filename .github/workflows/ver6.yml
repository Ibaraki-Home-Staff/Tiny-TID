# ver6: check on PR/push, auto-deploy the Cloudflare Worker on ver6 push.
# Reference: Dantalian build.yml (branch-gated deploy, pinned toolchains).
name: ver6

on:
  push:
    branches: [ver6]
  pull_request:
    branches: [ver6]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Test tid-core
        run: cargo test -p tid-core --locked
      - name: Check tid-worker (host + wasm)
        run: |
          cargo check -p tid-worker --locked
          cargo check -p tid-worker --locked --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Rebuild legacy bundles
        run: pwsh ./build-legacy.ps1

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/ver6'
    needs: [check, web]
    runs-on: ubuntu-latest
    concurrency:
      group: tiny-tid-cloudflare-deploy
      cancel-in-progress: false
    environment: Cloudflare
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment prerequisites
        id: prereq
        run: |
          skip=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || skip="CLOUDFLARE_API_TOKEN is not set"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || skip="CLOUDFLARE_ACCOUNT_ID is not set"
          if [ -n "$skip" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            {
              echo "## Deploy skipped"
              echo ""
              echo "Reason: $skip."
              echo "Register them in the GitHub Environment \`Cloudflare\`, then push again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Rust
        if: env.SKIP != 'true'
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked dependencies
        if: env.SKIP != 'true'
        run: cargo fetch --locked
      - name: Set up Bun
        if: env.SKIP != 'true'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        if: env.SKIP != 'true'
        run: bun install
      - name: Install worker-build
        if: env.SKIP != 'true'
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Rebuild legacy bundles
        if: env.SKIP != 'true'
        run: pwsh ./build-legacy.ps1
      - name: Provision D1 database
        if: env.SKIP != 'true'
        id: d1
        run: python ci/provision_d1.py
      - name: Render deploy config
        if: env.SKIP != 'true'
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          database_id = os.environ["D1_DATABASE_ID"].strip()
          if not database_id:
              raise SystemExit("D1 database_id was not provisioned")
          template = Path("wrangler.jsonc").read_text(encoding="utf-8")
          rendered = template.replace("REPLACE_WITH_D1_ID", database_id)
          if "REPLACE_WITH_D1_ID" in rendered:
              raise SystemExit("placeholder D1 database_id remains")
          raw = os.environ.get("CUSTOM_DOMAIN", "")
          domains = [d.strip() for d in raw.split(",") if d.strip()]
          marker = "  // __CUSTOM_DOMAIN_ROUTES__ (CI renders routes here when vars.CUSTOM_DOMAIN is set)"
          if domains:
              for d in domains:
                  if not re.fullmatch(r"[A-Za-z0-9.-]+", d):
                      raise SystemExit(f"CUSTOM_DOMAIN entry {d!r} must be a bare hostname without scheme or path")
              entries = ", ".join(
                  f'{{ "pattern": "{d}", "custom_domain": true }}' for d in domains
              )
              routes = f"  \"routes\": [ {entries} ],"
          else:
              routes = ""
          PY
      - name: Apply D1 migrations
        if: env.SKIP != 'true'
        run: bunx wrangler d1 migrations apply tiny-tid --remote --config wrangler.ci.jsonc
      - name: Set VAPID secrets
        if: env.SKIP != 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_SUBJECT" ]; then
            echo "VAPID secrets not set; skipping push signing."
            exit 0
          fi
          printf '%s' "$VAPID_PRIVATE_KEY" | bunx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.ci.jsonc
          printf '%s' "$VAPID_SUBJECT" | bunx wrangler secret put VAPID_SUBJECT --config wrangler.ci.jsonc
      - name: Deploy Worker
        if: env.SKIP != 'true'
        run: bunx wrangler deploy --config wrangler.ci.jsonc

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny-TID v2 - 茨木駅</title>
    <meta name="description" content="茨木駅 列車走行位置情報" />
    <base href="/" />
    <link rel="icon" href="/assets/img/placeholder.svg">
    <link rel="stylesheet" href="/assets/css/main.css?v=4">
    <link rel="stylesheet" href="/assets/css/v2-styles.css?v=4">
  </head>
  <body>
    <main class="container tid-app" data-tid-app>
      <nav class="tid-app__nav">
        <h1 class="tid-app__title">Tiny-TID v2 - 茨木駅</h1>
      </nav>

      <section class="tid-app__summary" aria-live="polite">
        <h2 class="tid-app__subtitle">JR西日本 列車走行位置情報</h2>
        <dl class="tid-app__meta">
          <div class="tid-app__meta-item">
            <dt>対象駅</dt>
            <dd>茨木駅 (0610226)</dd>
          </div>
          <div class="tid-app__meta-item">
            <dt>最終更新</dt>
            <dd data-updated-at>--:--</dd>
          </div>
        </dl>
      </section>

      <section class="tid-app__status">
        <h2 class="visually-hidden">運行状況</h2>
        <div data-status-message class="traffic-info"></div>
      </section>

      <section class="tid-app__filters">
        <h2>フィルタ設定</h2>
        <div class="filter-group">
          <label>
            <input type="checkbox" id="filter-local" value="local" checked>
            普通
          </label>
          <label>
            <input type="checkbox" id="filter-rapid" value="rapid" checked>
            快速
          </label>
          <label>
            <input type="checkbox" id="filter-special-rapid" value="special_rapid" checked>
            新快速
          </label>
          <label>
            <input type="checkbox" id="filter-limited-express" value="limited_express" checked>
            特急
          </label>
        </div>
      </section>

      <section class="tid-app__alarm-settings">
        <h2>アラーム設定</h2>
        <details id="alarmSettings">
          <summary>接近アラーム設定</summary>
          <div class="alarm-controls">
            <div class="alarm-direction-group">
              <h3>上り</h3>
              <label>
                <input type="checkbox" id="alarm-up-enable" />
                上り列車の接近アラームを有効化
              </label>
              <div class="alarm-types" id="alarm-up-types" style="margin-left: 1.5rem; margin-top: 0.5rem;">
                <label>
                  <input type="checkbox" class="alarm-up-type" value="local" />
                  普通
                </label>
                <label>
                  <input type="checkbox" class="alarm-up-type" value="rapid" />
                  快速
                </label>
                <label>
                  <input type="checkbox" class="alarm-up-type" value="special_rapid" />
                  新快速
                </label>
                <label>
                  <input type="checkbox" class="alarm-up-type" value="limited_express" />
                  特急
                </label>
              </div>
            </div>

            <div class="alarm-direction-group">
              <h3>下り</h3>
              <label>
                <input type="checkbox" id="alarm-down-enable" />
                下り列車の接近アラームを有効化
              </label>
              <div class="alarm-types" id="alarm-down-types" style="margin-left: 1.5rem; margin-top: 0.5rem;">
                <label>
                  <input type="checkbox" class="alarm-down-type" value="local" />
                  普通
                </label>
                <label>
                  <input type="checkbox" class="alarm-down-type" value="rapid" />
                  快速
                </label>
                <label>
                  <input type="checkbox" class="alarm-down-type" value="special_rapid" />
                  新快速
                </label>
                <label>
                  <input type="checkbox" class="alarm-down-type" value="limited_express" />
                  特急
                </label>
              </div>
            </div>
          </div>
        </details>
      </section>

      <section class="tid-app__board">
        <div class="tid-app__board-header">
          <h2>列車一覧</h2>
          <p class="updated-at" data-board-updated>更新: --</p>
        </div>
        <div data-board-container></div>
      </section>
    </main>

    <!-- Alert Modal -->
    <div class="tid-alert-overlay is-hidden" data-alert-overlay aria-hidden="true">
      <div class="tid-alert__panel" role="dialog" aria-modal="true" aria-labelledby="tidAlertTitle">
        <h2 class="tid-alert__title" id="tidAlertTitle"></h2>
        <div class="tid-alert__groups" data-alert-groups></div>
        <div class="tid-alert__actions">
          <button type="button" class="btn" data-alert-close>閉じる</button>
        </div>
      </div>
    </div>

    <!-- Audio Unlock Overlay -->
    <div class="tid-audio-overlay is-hidden" data-audio-overlay aria-hidden="true">
      <div class="tid-audio-overlay__panel" role="dialog" aria-modal="true" aria-labelledby="tidAudioTitle">
        <img class="tid-audio-overlay__icon" src="/assets/img/placeholder.svg" alt="">
        <h2 class="tid-audio-overlay__title" id="tidAudioTitle">アラームを有効にしますか？</h2>
        <p class="tid-audio-overlay__text">ブラウザの制限により、音声を鳴らすには手動での操作が必要です。</p>
        <p class="tid-audio-overlay__hint">「有効にする」を押すと、接近アラームを再生できるようになります。</p>
        <div class="tid-audio-overlay__actions">
          <button type="button" class="btn" data-audio-enable>有効にする</button>
          <button type="button" class="btn btn-ghost" data-audio-cancel>あとで</button>
        </div>
        <button type="button" class="tid-audio-overlay__close" data-audio-close aria-label="閉じる">×</button>
      </div>
    </div>

    <script type="module" src="/assets/js/v2/init.js?v=4"></script>
  </body>
</html>

[package]
name = "tid-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coarsetime = "0.1"
http = "1"
sha2 = "0.11"
tid-core = { path = "../tid-core" }
worker = { version = "0.8", features = ["d1"] }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
web-push-native = "0.5"
p256 = { version = "0.13", features = ["ecdh"] }
base64ct = { version = "1", features = ["alloc", "std"] }

# wasm runtime randomness backends (verified locally)
getrandom-wasm02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom-wasm04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

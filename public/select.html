<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny-TID - エリア選択</title>
    <meta name="description" content="Tiny-TID エリア・路線・駅選択" />
    <base href="/" />
    <link rel="icon" href="/assets/img/placeholder.svg">
    <link rel="manifest" href="/manifest.webmanifest?v=6">
    <meta name="app:version" content="6">
    <link rel="stylesheet" href="/assets/css/main.css?v=15">
  </head>
  <body>
    <header data-include="header"></header>
    <main class="container">
      <h1>エリア選択</h1>
      <p>エリア・路線・駅を選ぶと列車走行位置を表示します。</p>
      <section aria-labelledby="area-heading" style="margin:1rem 0;">
        <h2 id="area-heading" style="margin-bottom:.5rem;">エリアを選択</h2>
        <label for="areaSelect" style="display:block; margin-bottom:.35rem;">エリア</label>
        <select id="areaSelect" name="area" style="min-width:260px">
          <option value="" selected disabled>読み込み中…</option>
        </select>
        <div style="height:.75rem"></div>
        <label for="lineSelect" style="display:block; margin-bottom:.35rem;">路線</label>
        <select id="lineSelect" name="line" style="min-width:260px" disabled>
          <option value="">エリアを選択してください</option>
        </select>
        <div style="height:.75rem"></div>
        <label for="stationSelect" style="display:block; margin-bottom:.35rem;">駅</label>
        <select id="stationSelect" name="station" style="min-width:260px" disabled>
          <option value="">路線を選択してください</option>
        </select>
        <div style="height:.75rem"></div>
        <button id="showBtn" class="btn" type="button" disabled>表示</button>
        <p id="selectError" class="component-error" style="display:none;" role="alert"></p>
      </section>
      <p>
        <a class="btn" href="/index.html">茨木駅</a>
      </p>
    </main>
    <script src="/assets/js/select.js?v=1"></script>
  </body>
</html>
